<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Main gradient (purple to cyan) -->
    <radialGradient id="mainGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#a855ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9a4dff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6dd5ff;stop-opacity:1" />
    </radialGradient>

    <!-- Glow effect -->
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#9a4dff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#6dd5ff;stop-opacity:0" />
    </radialGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle with shadow -->
  <circle cx="256" cy="256" r="200" fill="url(#mainGradient)" filter="url(#shadow)" />

  <!-- Highlight -->
  <ellipse cx="256" cy="200" rx="120" ry="100" fill="url(#glowGradient)" opacity="0.6" />

  <!-- Optional: G letter in center (minimalist) -->
  <text x="256" y="300" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="180" font-weight="700" fill="white" text-anchor="middle" opacity="0.95" style="letter-spacing: -4px;">G</text>
</svg>
