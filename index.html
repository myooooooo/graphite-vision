<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRADIENT — Digital Graphite Intelligence</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Loupe globale placée juste après l'ouverture du body pour sortir des conteneurs relatifs -->
  <div class="magnifier glass" id="magnifier">
    <canvas id="mag-canvas" width="180" height="180"></canvas>
    <div class="magnifier-value" id="magnifier-value">--</div>
  </div>

  <header class="topbar glass">
    <div class="brand">
      <div class="logo-dot"></div>
      <div>
        <div class="title">GRADIENT</div>
        <div class="subtitle">Digital Graphite Intelligence</div>
      </div>
    </div>
    <div class="nav-actions">
      <div class="swatch" id="status-swatch"></div>
    </div>
  </header>

  <div class="status-badge glass" id="status-bar">
    <span class="status-main" id="status-pencil">Crayon : --</span>
    <span class="status-sub" id="status-meta">Valeur : -- • Hex : -- • X:-- Y:--</span>
  </div>

  <main class="app-grid">

    <aside class="sidebar glass leftbar">
      <input type="file" id="file-input" accept="image/*" hidden />
      <button class="btn neon import-btn" id="drop-zone">Importer une image</button>
      <div class="panel-section" id="controls">
        <div class="section-title">Réglages</div>
        <label class="pill toggle"><input type="checkbox" id="toggle-posterize" /> Simplifier les masses</label>
        <label class="pill toggle">Grille
          <input type="range" id="grid-slider" min="0" max="10" step="1" value="0" />
          <span id="grid-value">0x0</span>
        </label>
        <label class="pill toggle">Couleur Grille
          <input type="color" id="grid-color" value="#8A22BE" />
        </label>
        <label class="pill toggle">Épaisseur Grille
          <input type="range" id="grid-thickness" min="0.5" max="3" step="0.1" value="1" />
          <span id="grid-thickness-value">1px</span>
        </label>
        <div class="progress" id="progress-bar"><span></span></div>
      </div>
    </aside>

    <section class="main-area viewport">
      <div class="panel glass switcher" id="canvas-area" hidden>
        <div class="panel-head">
          <span>Avant / Après</span>
          <label class="toggle"><input type="checkbox" id="toggle-bw-only" /> Afficher original + NB</label>
        </div>
        <div class="dual-canvas">
          <div class="canvas-stack">
            <div class="label-overlay">Avant</div>
            <canvas id="canvas-original"></canvas>
          </div>
          <div class="canvas-stack" id="bw-stack">
            <div class="label-overlay">Après</div>
            <canvas id="canvas-bw"></canvas>
            <div class="crosshair" id="crosshair"></div>
          </div>
        </div>
      </div>
    </section>

    <aside class="sidebar glass rightbar" id="workspace" hidden>
      <div class="panel-section" id="palette-panel" hidden>
        <div class="section-title">Crayons utilisés</div>
        <ul class="palette-list" id="palette-list"></ul>
      </div>

      <div class="panel-section actions">
        <div class="section-title">Actions</div>
        <div class="actions-bottom">
          <button id="export-guide" class="btn ghost secondary">Exporter le guide de dessin</button>
          <button id="export-image" class="btn neon">Exporter ma Fiche de Travail</button>
          <div class="export-output" id="export-output">Clique pour générer le guide.</div>
        </div>
      </div>
    </aside>
  </main>

  <!-- Charge le moteur avant l'UI pour garantir l'accès aux fonctions globales -->
  <script src="js/core.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
