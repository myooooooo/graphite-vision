<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRADIENT - Social Media Image Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a24 0%, #0f0f16 100%);
      color: #e0e0e0;
      padding: 40px 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #9a4dff, #6dd5ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: #888;
      margin-bottom: 40px;
      font-size: 1.1rem;
    }

    .button {
      background: linear-gradient(135deg, #9a4dff, #6dd5ff);
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
      display: inline-block;
      margin-right: 15px;
      margin-bottom: 15px;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(154, 77, 255, 0.4);
    }

    .preview-container {
      margin-top: 40px;
      display: grid;
      gap: 30px;
    }

    .preview-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 20px;
    }

    .preview-title {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: #9a4dff;
    }

    .preview-canvas {
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .hidden {
      display: none;
    }

    /* Preview card styles */
    .og-card, .twitter-card {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, rgba(154,77,255,0.15), transparent 60%),
                  linear-gradient(135deg, #1a1a24 0%, #0f0f16 100%);
    }

    .card-content {
      position: relative;
      z-index: 2;
      padding: 60px;
    }

    .card-logo {
      margin-bottom: 40px;
    }

    .card-title {
      font-size: 72px;
      font-weight: 700;
      background: linear-gradient(135deg, #9a4dff, #6dd5ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
      letter-spacing: 4px;
    }

    .card-subtitle {
      font-size: 32px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 30px;
      font-weight: 300;
    }

    .card-description {
      font-size: 24px;
      color: rgba(255, 255, 255, 0.6);
      max-width: 900px;
      margin: 0 auto;
      line-height: 1.6;
    }

    .decorative-dots {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0.1;
    }

    .dot {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, #9a4dff, #6dd5ff);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🖼️ GRADIENT Social Media Generator</h1>
    <p class="subtitle">Generate Open Graph and Twitter Card images</p>

    <div>
      <button class="button" onclick="generateOGImage()">Generate Open Graph Image (1200×630)</button>
      <button class="button" onclick="generateTwitterCard()">Generate Twitter Card (1200×675)</button>
    </div>

    <div class="preview-container">
      <div id="og-preview" class="preview-item hidden">
        <div class="preview-title">📘 Open Graph Image (Facebook, LinkedIn)</div>
        <canvas id="og-canvas" class="preview-canvas"></canvas>
        <button class="button" style="margin-top: 15px;" onclick="downloadCanvas('og-canvas', 'og-image.png')">
          ⬇️ Download og-image.png
        </button>
      </div>

      <div id="twitter-preview" class="preview-item hidden">
        <div class="preview-title">🐦 Twitter Card Image</div>
        <canvas id="twitter-canvas" class="preview-canvas"></canvas>
        <button class="button" style="margin-top: 15px;" onclick="downloadCanvas('twitter-canvas', 'twitter-card.png')">
          ⬇️ Download twitter-card.png
        </button>
      </div>
    </div>
  </div>

  <script>
    function createGradientLogo(ctx, x, y, size) {
      // Create radial gradient
      const gradient = ctx.createRadialGradient(x, y, 0, x, y, size / 2);
      gradient.addColorStop(0, '#a855ff');
      gradient.addColorStop(0.5, '#9a4dff');
      gradient.addColorStop(1, '#6dd5ff');

      // Draw main circle
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(x, y, size / 2, 0, Math.PI * 2);
      ctx.fill();

      // Add highlight/glow
      const glowGradient = ctx.createRadialGradient(x, y - size * 0.1, 0, x, y - size * 0.1, size * 0.4);
      glowGradient.addColorStop(0, 'rgba(255, 255, 255, 0.4)');
      glowGradient.addColorStop(0.5, 'rgba(154, 77, 255, 0.2)');
      glowGradient.addColorStop(1, 'rgba(109, 213, 255, 0)');

      ctx.fillStyle = glowGradient;
      ctx.globalAlpha = 0.7;
      ctx.beginPath();
      ctx.ellipse(x, y - size * 0.1, size * 0.3, size * 0.25, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    function drawBackground(ctx, width, height) {
      // Dark gradient background
      const bgGradient = ctx.createLinearGradient(0, 0, width, height);
      bgGradient.addColorStop(0, '#1a1a24');
      bgGradient.addColorStop(1, '#0f0f16');
      ctx.fillStyle = bgGradient;
      ctx.fillRect(0, 0, width, height);

      // Radial glow effect
      const glowGradient = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, width * 0.6);
      glowGradient.addColorStop(0, 'rgba(154, 77, 255, 0.15)');
      glowGradient.addColorStop(0.6, 'rgba(154, 77, 255, 0.05)');
      glowGradient.addColorStop(1, 'transparent');
      ctx.fillStyle = glowGradient;
      ctx.fillRect(0, 0, width, height);

      // Decorative dots
      ctx.fillStyle = 'rgba(154, 77, 255, 0.1)';
      for (let i = 0; i < 20; i++) {
        const x = Math.random() * width;
        const y = Math.random() * height;
        const size = Math.random() * 40 + 10;
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function generateOGImage() {
      const canvas = document.getElementById('og-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 1200;
      canvas.height = 630;

      // Background
      drawBackground(ctx, 1200, 630);

      // Logo
      createGradientLogo(ctx, 600, 200, 160);

      // Title
      ctx.font = 'bold 72px -apple-system, system-ui, sans-serif';
      const titleGradient = ctx.createLinearGradient(0, 280, 1200, 280);
      titleGradient.addColorStop(0, '#9a4dff');
      titleGradient.addColorStop(1, '#6dd5ff');
      ctx.fillStyle = titleGradient;
      ctx.textAlign = 'center';
      ctx.letterSpacing = '4px';
      ctx.fillText('GRADIENT', 600, 310);

      // Subtitle
      ctx.font = '300 32px -apple-system, system-ui, sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.fillText('Digital Graphite Intelligence', 600, 360);

      // Description
      ctx.font = '24px -apple-system, system-ui, sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.fillText('Outil gratuit de référence pour dessin au crayon', 600, 420);
      ctx.fillText('Grille • Valeurs graphite 9H-9B • Export PDF/PNG', 600, 460);

      // Footer
      ctx.font = '20px -apple-system, system-ui, sans-serif';
      ctx.fillStyle = 'rgba(154, 77, 255, 0.8)';
      ctx.fillText('gradient-vision.app', 600, 560);

      document.getElementById('og-preview').classList.remove('hidden');
    }

    function generateTwitterCard() {
      const canvas = document.getElementById('twitter-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 1200;
      canvas.height = 675;

      // Background
      drawBackground(ctx, 1200, 675);

      // Logo
      createGradientLogo(ctx, 600, 230, 160);

      // Title
      ctx.font = 'bold 72px -apple-system, system-ui, sans-serif';
      const titleGradient = ctx.createLinearGradient(0, 320, 1200, 320);
      titleGradient.addColorStop(0, '#9a4dff');
      titleGradient.addColorStop(1, '#6dd5ff');
      ctx.fillStyle = titleGradient;
      ctx.textAlign = 'center';
      ctx.letterSpacing = '4px';
      ctx.fillText('GRADIENT', 600, 350);

      // Subtitle
      ctx.font = '300 32px -apple-system, system-ui, sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.fillText('Digital Graphite Intelligence', 600, 405);

      // Description
      ctx.font = '24px -apple-system, system-ui, sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.fillText('Convertis tes photos en références de dessin', 600, 465);
      ctx.fillText('Grille • Valeurs graphite 9H-9B • Export PDF/PNG', 600, 505);

      // Footer
      ctx.font = '20px -apple-system, system-ui, sans-serif';
      ctx.fillStyle = 'rgba(154, 77, 255, 0.8)';
      ctx.fillText('✨ 100% Gratuit', 600, 600);

      document.getElementById('twitter-preview').classList.remove('hidden');
    }

    function downloadCanvas(canvasId, filename) {
      const canvas = document.getElementById(canvasId);
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      }, 'image/png');
    }
  </script>
</body>
</html>
